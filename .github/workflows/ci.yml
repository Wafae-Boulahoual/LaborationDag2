name: CI
on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
       - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest


    steps:
    - name: Pull code
      uses: actions/checkout@v7

    - name: install .Net10
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'
        
    - name: Restore
      run: dotnet restore

    - name : Build project
      run: dotnet build --no-restore --configuration Release

    - name: Test project
      run: dotnet test --no-build --configuration Release

    - name: Run code
      run: dotnet run --project LaborationDag2/Elves/Elves.csproj
    
